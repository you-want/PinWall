name: Desktop CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test and build desktop
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test:run

      - name: Test beta release validation
        run: node --test scripts/release-preflight.test.mjs

      - name: Build frontend bundle
        run: pnpm build

      - name: Install browser for UI regression tests
        run: pnpm exec playwright install chromium

      - name: Run browser UI and persistence regression tests
        run: pnpm test:e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-report
          path: |
            desktop/playwright-report/
            desktop/test-results/
          retention-days: 7

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: desktop/src-tauri
