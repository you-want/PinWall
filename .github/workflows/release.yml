name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          node -e "const fs=require('fs'); const pkg=require('./package.json'); const tauri=require('./src-tauri/tauri.conf.json'); if (pkg.version !== '$VERSION') throw new Error('package.json version mismatch: '+pkg.version+' !== $VERSION'); if (tauri.version !== '$VERSION') throw new Error('tauri.conf.json version mismatch: '+tauri.version+' !== $VERSION');"
          grep -q '^version = "'$VERSION'"' src-tauri/Cargo.toml
          test -f "releases/${TAG}.md"

      - name: Run frontend unit tests
        run: pnpm test:run

      - name: Build frontend bundle
        run: pnpm build

      - name: Run Rust tests
        run: cargo test
        working-directory: desktop/src-tauri

  build-macos:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64

    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
          projectPath: desktop
          certificatePassword: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Debug - list bundle output
        run: |
          echo "=== bundle dir ==="
          find src-tauri/target/release/bundle -maxdepth 3 2>/dev/null || echo "not found at release"
          find src-tauri/target/${{ matrix.target }}/release/bundle -maxdepth 3 2>/dev/null || echo "not found at target"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  macos-universal:
    needs: build-macos
    runs-on: macos-latest

    steps:
      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: macos-aarch64

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: macos-x86_64

      - name: Create universal binary and DMG
        run: |
          set -euo pipefail

          # Find DMG files
          AARCH64_DMG=$(find macos-aarch64 -name "*.dmg" | head -1)
          X86_64_DMG=$(find macos-x86_64 -name "*.dmg" | head -1)

          echo "aarch64 DMG: $AARCH64_DMG"
          echo "x86_64 DMG: $X86_64_DMG"

          if [ -z "$AARCH64_DMG" ] || [ -z "$X86_64_DMG" ]; then
            echo "ERROR: DMG files not found"
            find macos-aarch64 macos-x86_64 -type f
            exit 1
          fi

          # Mount DMGs and extract .app
          mkdir -p aarch64-mount x86_64-mount

          hdiutil attach "$AARCH64_DMG" -mountpoint aarch64-mount -nobrowse -quiet
          hdiutil attach "$X86_64_DMG" -mountpoint x86_64-mount -nobrowse -quiet

          # Find .app inside mounted DMGs
          AARCH64_APP=$(find aarch64-mount -name "*.app" -type d -maxdepth 1 | head -1)
          X86_64_APP=$(find x86_64-mount -name "*.app" -type d -maxdepth 1 | head -1)

          echo "aarch64 .app: $AARCH64_APP"
          echo "x86_64 .app: $X86_64_APP"

          APP_NAME=$(basename "$AARCH64_APP")

          # Detect actual binary name inside Contents/MacOS/
          BINARY_NAME=$(ls "$AARCH64_APP/Contents/MacOS/" | head -1)
          echo "Binary name: $BINARY_NAME"

          # Copy aarch64 .app as base for universal
          cp -R "$AARCH64_APP" "Universal-$APP_NAME"

          # Merge binaries with lipo
          lipo -create \
            "$AARCH64_APP/Contents/MacOS/$BINARY_NAME" \
            "$X86_64_APP/Contents/MacOS/$BINARY_NAME" \
            -output "Universal-$APP_NAME/Contents/MacOS/$BINARY_NAME"

          echo "Universal binary:"
          lipo -info "Universal-$APP_NAME/Contents/MacOS/$BINARY_NAME"

          # Unmount DMGs
          hdiutil detach aarch64-mount -quiet
          hdiutil detach x86_64-mount -quiet

          # Re-sign the universal binary if signing identity is available
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "Re-signing universal binary..."
            codesign --force --deep --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" "Universal-$APP_NAME"
          fi

          # Create universal DMG
          hdiutil create -volname "PinWall" \
            -srcfolder "Universal-$APP_NAME" \
            -ov -format UDZO \
            "PinWall-universal.dmg"

          echo "Done! Universal DMG:"
          ls -lh PinWall-universal.dmg

      - name: Upload universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: PinWall-universal.dmg

  publish:
    needs: macos-universal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Resolve release tag
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            artifacts/macos-universal/*.dmg
            artifacts/macos-aarch64/*.dmg
            artifacts/macos-x86_64/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: desktop/releases/${{ steps.release.outputs.tag }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
