name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          projectPath: desktop

      - name: Debug bundle output
        if: matrix.platform == 'macos-latest'
        run: |
          echo "=== Bundle directory contents ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f -o -type d | head -30 || echo "Bundle dir not found"

      # Upload macOS .app.tar.gz for universal binary merge
      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.dmg

      - name: Upload Linux artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # Merge macOS x86_64 and aarch64 into universal binary
  macos-universal:
    needs: release
    runs-on: macos-latest

    steps:
      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: macos-aarch64

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: macos-x86_64

      - name: List downloaded files
        run: |
          echo "=== aarch64 ==="
          find macos-aarch64 -type f
          echo "=== x86_64 ==="
          find macos-x86_64 -type f

      - name: Create universal .app bundle
        run: |
          set -euo pipefail

          # Extract .app from tar.gz
          mkdir -p aarch64-app x86_64-app

          AARCH64_TAR=$(find macos-aarch64 -name "*.app.tar.gz" | head -1)
          X86_64_TAR=$(find macos-x86_64 -name "*.app.tar.gz" | head -1)

          if [ -z "$AARCH64_TAR" ] || [ -z "$X86_64_TAR" ]; then
            echo "ERROR: Could not find .app.tar.gz files"
            echo "aarch64 files:"
            find macos-aarch64 -type f
            echo "x86_64 files:"
            find macos-x86_64 -type f
            exit 1
          fi

          echo "Extracting aarch64: $AARCH64_TAR"
          tar -xzf "$AARCH64_TAR" -C aarch64-app

          echo "Extracting x86_64: $X86_64_TAR"
          tar -xzf "$X86_64_TAR" -C x86_64-app

          # Find extracted .app directories
          AARCH64_APP=$(find aarch64-app -name "*.app" -type d -maxdepth 2 | head -1)
          X86_64_APP=$(find x86_64-app -name "*.app" -type d -maxdepth 2 | head -1)

          echo "aarch64 .app: $AARCH64_APP"
          echo "x86_64 .app: $X86_64_APP"

          APP_NAME=$(basename "$AARCH64_APP")
          BINARY_NAME="${APP_NAME%.app}"

          echo "App name: $APP_NAME, Binary: $BINARY_NAME"

          # Copy aarch64 as base for universal app
          cp -R "$AARCH64_APP" "Universal-$APP_NAME"

          # Merge binaries with lipo
          UNIVERSAL_BIN="Universal-$APP_NAME/Contents/MacOS/$BINARY_NAME"

          lipo -create \
            "$AARCH64_APP/Contents/MacOS/$BINARY_NAME" \
            "$X86_64_APP/Contents/MacOS/$BINARY_NAME" \
            -output "$UNIVERSAL_BIN"

          echo "Universal binary created:"
          lipo -info "$UNIVERSAL_BIN"

          # Create universal DMG
          hdiutil create -volname "PinWall" \
            -srcfolder "Universal-$APP_NAME" \
            -ov -format UDZO \
            "PinWall-universal.dmg"

          echo "Universal DMG created"
          ls -lh PinWall-universal.dmg

      - name: Upload universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: PinWall-universal.dmg

  # Create GitHub Release with all artifacts
  publish:
    needs: [release, macos-universal]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-universal/*.dmg
            artifacts/macos-aarch64/*.dmg
            artifacts/macos-x86_64/*.dmg
            artifacts/linux/*.deb
            artifacts/linux/*.AppImage
            artifacts/windows/*.msi
            artifacts/windows/*.exe
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | macOS (Universal) | `PinWall-universal.dmg` |
            | macOS (Apple Silicon) | `.dmg` (aarch64) |
            | macOS (Intel) | `.dmg` (x86_64) |
            | Windows | `.msi` or `.exe` |
            | Linux | `.deb` or `.AppImage` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
