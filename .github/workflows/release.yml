name: Release

# Stable releases stay disabled until signing/notarization and updater validation.
# Beta automation creates a draft; it never publishes or replaces Latest.
on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing beta tag, for example v0.1.4-beta.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Verify beta source and tests
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Only vX.Y.Z-beta.N draft releases are enabled.' >&2
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin the verified source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/release-preflight.test.mjs
      - name: Verify release version and notes
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-preflight.mjs "$RELEASE_TAG"
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: beta-test-failures
          path: |
            desktop/playwright-report/
            desktop/test-results/
          retention-days: 7

  build-macos:
    name: Build universal macOS beta
    needs: preflight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      # Tauri merges architectures before signing; never splice signed DMGs.
      # Keep the .app for verification: dmg-only builds clean it up afterwards.
      - run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --ci
      - name: Verify app signature and both architectures
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/PinWall.app
          codesign --verify --deep --strict "$APP"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/desktop"
      - name: Stage release files and checksums
        run: |
          set -euo pipefail
          mkdir -p beta-artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg beta-artifacts/
          cd beta-artifacts
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-beta
          path: desktop/beta-artifacts/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare draft prerelease
    needs: [preflight, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-beta
          path: beta-artifacts
      - name: Create or update an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("Refusing to modify an already published release")'
            gh release edit "$RELEASE_TAG" --draft --prerelease --latest=false --notes-file "desktop/releases/$RELEASE_TAG.md"
            gh release upload "$RELEASE_TAG" beta-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" beta-artifacts/* --verify-tag --draft --prerelease --latest=false --title "PinWall $RELEASE_TAG (Internal Beta)" --notes-file "desktop/releases/$RELEASE_TAG.md"
          fi
