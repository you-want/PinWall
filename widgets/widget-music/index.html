<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter Variable', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      height: 100vh;
      overflow: hidden;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .music-player {
      width: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .album-art {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      animation: pulse-art 3s ease-in-out infinite;
    }
    .album-art.playing { animation: pulse-art 2s ease-in-out infinite; }
    .album-art.paused { animation: none; }
    @keyframes pulse-art {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .track-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .track-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist-name {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(0,0,0,0.08);
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      transition: width 1s linear;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #9ca3af;
      font-variant-numeric: tabular-nums;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #4b5563;
      transition: all 0.15s;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { color: #6366f1; transform: scale(1.1); }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn.play {
      width: 40px;
      height: 40px;
      background: #6366f1;
      color: white;
      font-size: 18px;
    }
    .ctrl-btn.play:hover { background: #4f46e5; }
    .volume-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .volume-icon { font-size: 14px; color: #9ca3af; }
    .volume-bar {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .volume-fill {
      height: 100%;
      border-radius: 2px;
      background: #9ca3af;
      transition: width 0.2s;
    }
    .idle-state {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 20px 0;
    }
    .idle-state .icon { font-size: 32px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="music-player" id="player">
    <div class="idle-state">
      <div class="icon">🎵</div>
      <div>等待音乐播放...</div>
    </div>
  </div>

  <script>
    let state = {
      isPlaying: false,
      trackName: '',
      artistName: '',
      albumName: '',
      position: 0,
      duration: 0,
      volume: 0.7,
    };

    let bridgeId = 0;
    const pending = new Map();

    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (msg?.type === 'event' && msg.event === 'pinwall:ready') {
        pollMediaInfo();
        setInterval(pollMediaInfo, 3000);
      }
      if (msg?.type === 'response' && pending.has(msg.id)) {
        const p = pending.get(msg.id);
        pending.delete(msg.id);
        msg.success ? p.resolve(msg.data) : p.reject(new Error(msg.error));
      }
    });

    function bridge(module, method, args) {
      return new Promise((resolve, reject) => {
        const id = `music_${++bridgeId}`;
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ type: 'request', id, module, method, args }, '*');
        setTimeout(() => {
          if (pending.has(id)) { pending.delete(id); reject(new Error('timeout')); }
        }, 5000);
      });
    }

    function formatTime(sec) {
      if (!sec || sec <= 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    async function pollMediaInfo() {
      try {
        const info = await bridge('system', 'getMediaInfo', []);
        if (info && info.trackName) {
          state = { ...state, ...info };
          renderPlayer();
        } else {
          renderIdle();
        }
      } catch {
        // If media info not available, show idle
        renderIdle();
      }
    }

    function renderIdle() {
      const container = document.getElementById('player');
      container.innerHTML = `
        <div class="idle-state">
          <div class="icon">🎵</div>
          <div>等待音乐播放...</div>
        </div>
      `;
    }

    function renderPlayer() {
      const container = document.getElementById('player');
      const progressPct = state.duration > 0 ? (state.position / state.duration * 100) : 0;

      container.innerHTML = `
        <div class="now-playing">
          <div class="album-art ${state.isPlaying ? 'playing' : 'paused'}">🎵</div>
          <div class="track-info">
            <div class="track-name">${escapeHtml(state.trackName)}</div>
            <div class="artist-name">${escapeHtml(state.artistName || '未知艺术家')}</div>
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progressPct}%"></div>
          </div>
          <div class="time-info">
            <span>${formatTime(state.position)}</span>
            <span>${formatTime(state.duration)}</span>
          </div>
        </div>

        <div class="controls">
          <button class="ctrl-btn" onclick="control('previous')">⏮</button>
          <button class="ctrl-btn play" onclick="control('${state.isPlaying ? 'pause' : 'play'}')">
            ${state.isPlaying ? '⏸' : '▶'}
          </button>
          <button class="ctrl-btn" onclick="control('next')">⏭</button>
        </div>

        <div class="volume-section">
          <span class="volume-icon">${state.volume > 0.5 ? '🔊' : state.volume > 0 ? '🔉' : '🔇'}</span>
          <div class="volume-bar">
            <div class="volume-fill" style="width: ${state.volume * 100}%"></div>
          </div>
        </div>
      `;
    }

    function control(action) {
      bridge('system', 'mediaControl', [action]).catch(() => {});
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // Initial render
    renderIdle();
  </script>
</body>
</html>
