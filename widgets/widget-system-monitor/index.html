<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Monitor Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter Variable', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      height: 100vh;
      overflow: hidden;
      color: #1a1a1a;
    }
    .monitor {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
    }
    .metric {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .metric-label {
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .metric-value {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .bar {
      height: 6px;
      border-radius: 3px;
      background: rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .bar-fill.green { background: linear-gradient(90deg, #10b981, #34d399); }
    .bar-fill.yellow { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .bar-fill.red { background: linear-gradient(90deg, #ef4444, #f87171); }
    .bar-fill.blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .battery-icon { font-size: 14px; }
    .loading { text-align: center; color: #9ca3af; font-size: 13px; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="monitor" id="monitor">
    <div class="loading">加载中...</div>
  </div>

  <script>
    let config = { refreshInterval: 3 };
    let _bridgeId = 0;
    const _pending = new Map();

    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (msg?.type === 'event' && msg.event === 'pinwall:ready') {
        if (msg.payload?.settings) config = { ...config, ...msg.payload.settings };
        fetchSystemInfo();
        setInterval(fetchSystemInfo, config.refreshInterval * 1000);
      }
      if (msg?.type === 'response' && _pending.has(msg.id)) {
        const p = _pending.get(msg.id);
        _pending.delete(msg.id);
        msg.success ? p.resolve(msg.data) : p.reject(new Error(msg.error));
      }
    });

    function bridge(module, method, args) {
      return new Promise((resolve, reject) => {
        const id = `sm_${++_bridgeId}`;
        _pending.set(id, { resolve, reject });
        window.parent.postMessage({ type: 'request', id, module, method, args }, '*');
        setTimeout(() => {
          if (_pending.has(id)) { _pending.delete(id); reject(new Error('timeout')); }
        }, 5000);
      });
    }

    function getBarColor(pct) {
      if (pct > 85) return 'red';
      if (pct > 60) return 'yellow';
      return 'green';
    }

    function formatBytes(bytes) {
      if (bytes >= 1e9) return (bytes / 1e9).toFixed(1) + ' GB';
      if (bytes >= 1e6) return (bytes / 1e6).toFixed(0) + ' MB';
      return (bytes / 1e3).toFixed(0) + ' KB';
    }

    async function fetchSystemInfo() {
      const container = document.getElementById('monitor');
      try {
        const [battery, memory] = await Promise.all([
          bridge('system', 'getBattery', []).catch(() => ({ level: -1, charging: false })),
          bridge('system', 'getMemoryInfo', []).catch(() => ({ total: 0, used: 0, free: 0 })),
        ]);

        const memPct = memory.total > 0 ? (memory.used / memory.total * 100).toFixed(0) : 0;
        const battPct = battery.level >= 0 ? (battery.level * 100).toFixed(0) : '--';
        const battColor = battery.level >= 0 ? getBarColor(100 - battery.level * 100) : 'blue';
        const battIcon = battery.charging ? '🔌' : (battery.level > 0.5 ? '🔋' : '🪫');

        container.innerHTML = `
          <div class="metric">
            <div class="metric-header">
              <span class="metric-label">💾 内存</span>
              <span class="metric-value">${memPct}%</span>
            </div>
            <div class="bar">
              <div class="bar-fill ${getBarColor(memPct)}" style="width: ${memPct}%"></div>
            </div>
            <div style="font-size: 11px; color: #9ca3af;">
              ${formatBytes(memory.used)} / ${formatBytes(memory.total)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-header">
              <span class="metric-label"><span class="battery-icon">${battIcon}</span> 电池</span>
              <span class="metric-value">${battPct}%</span>
            </div>
            <div class="bar">
              <div class="bar-fill ${battColor}" style="width: ${battery.level >= 0 ? battery.level * 100 : 0}%"></div>
            </div>
            <div style="font-size: 11px; color: #9ca3af;">
              ${battery.charging ? '充电中' : '未充电'}
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="loading">获取系统信息失败</div>`;
      }
    }
  </script>
</body>
</html>
