<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle (wall representation) -->
  <circle cx="32" cy="32" r="30" fill="#1e293b"/>

  <!-- Sticky note -->
  <g filter="url(#shadow)">
    <path d="M16 14 L44 14 L44 48 L40 52 L16 52 Z" fill="url(#noteGradient)" rx="2"/>
    <!-- Folded corner -->
    <path d="M40 52 L40 48 L44 48 Z" fill="#fcd34d"/>
  </g>

  <!-- Pushpin -->
  <g filter="url(#shadow)">
    <!-- Pin head -->
    <circle cx="38" cy="18" r="8" fill="url(#pinGradient)"/>
    <!-- Pin highlight -->
    <circle cx="36" cy="16" r="2.5" fill="#fde68a" opacity="0.8"/>
    <!-- Pin needle -->
    <line x1="38" y1="26" x2="38" y2="32" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- "P" letter on note -->
  <text x="24" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#78350f">P</text>

  <!-- Small decorative dots (wall texture) -->
  <circle cx="12" cy="20" r="1" fill="#475569" opacity="0.5"/>
  <circle cx="12" cy="32" r="1" fill="#475569" opacity="0.5"/>
  <circle cx="12" cy="44" r="1" fill="#475569" opacity="0.5"/>
</svg>