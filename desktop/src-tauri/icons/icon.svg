<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle (wall representation) -->
  <circle cx="256" cy="256" r="240" fill="#1e293b"/>

  <!-- Sticky note -->
  <g filter="url(#shadow)">
    <path d="M128 112 L352 112 L352 384 L320 416 L128 416 Z" fill="url(#noteGradient)" rx="8"/>
    <!-- Folded corner -->
    <path d="M320 416 L320 384 L352 384 Z" fill="#fcd34d"/>
  </g>

  <!-- Pushpin -->
  <g filter="url(#shadow)">
    <!-- Pin head -->
    <circle cx="304" cy="144" r="64" fill="url(#pinGradient)"/>
    <!-- Pin highlight -->
    <circle cx="288" cy="128" r="20" fill="#fde68a" opacity="0.8"/>
    <!-- Pin needle -->
    <line x1="304" y1="208" x2="304" y2="256" stroke="#92400e" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- "P" letter on note -->
  <text x="192" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="144" font-weight="700" fill="#78350f">P</text>

  <!-- Small decorative dots (wall texture) -->
  <circle cx="96" cy="160" r="8" fill="#475569" opacity="0.5"/>
  <circle cx="96" cy="256" r="8" fill="#475569" opacity="0.5"/>
  <circle cx="96" cy="352" r="8" fill="#475569" opacity="0.5"/>
</svg>