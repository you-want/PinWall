<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:18px;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#f5f5f7}h1{font-size:16px;margin:0 0 10px}p{font-size:12px;color:#c8c7cf}button{width:100%;border:0;border-radius:8px;padding:9px;background:#d3c7f6;color:#25212e;font:inherit;cursor:pointer}button:disabled{opacity:.6}button:focus-visible{outline:2px solid white;outline-offset:3px}</style></head><body><h1></h1><p></p><button disabled></button><p role="status"></p><script>
const labels={"en": ["File Shelf", "Keep selected file references for seven days. Originals stay in place.", "Open shelf"], "zh": ["文件暂存", "保存所选文件的引用，保留七天；原文件不移动。", "打开暂存"]},moduleName="shelf";let locale='en',ready=false,busy=false,seq=0,timer=null;const pending=new Map(),title=document.querySelector('h1'),description=document.querySelector('p'),button=document.querySelector('button'),status=document.querySelector('[role="status"]');
function render(){document.documentElement.lang=locale;[title.textContent,description.textContent,button.textContent]=labels[locale];button.disabled=!ready||busy;}
function request(method){return new Promise((resolve,reject)=>{const id=`tool_${++seq}`;pending.set(id,{resolve,reject});parent.postMessage({type:'request',version:1,id,module:moduleName,method,args:[]},'*');});}
button.onclick=async()=>{if(busy||!ready)return;busy=true;status.textContent=locale==='zh'?'请在 PinWall 中操作…':'Continue in PinWall…';render();try{await request('open');status.textContent='';}catch{status.textContent=locale==='zh'?'打开失败，请重试':'Could not open. Try again.';}finally{busy=false;render();}};
addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(m?.type==='response'&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.success?p.resolve(m.data):p.reject(new Error('failed'));}else if(m?.type==='event'&&m.event==='pinwall:ready'){locale=m.payload?.locale==='zh'?'zh':'en';ready=true;render();}});
addEventListener('pagehide',()=>{clearTimeout(timer);for(const p of pending.values())p.reject(new Error('closed'));pending.clear();});render();
</script></body></html>
